name: MineStormReportSystem
main: com.minestorm.reportsystem.ReportSystem
version: 1.0.0
author: MineStorm
description: Advanced GUI report system
api-version: 1.13

commands:
  report:
    description: Report a player
    usage: /report <player>
  my-task:
    description: Open admin panel
    usage: /my-task [reload]
    aliases: [mytask]

permissions:
  reports.use: { default: true }
  reports.admin: { default: op }
  reports.bypass: { default: op }
  reports.*:
    default: op
    children:
      reports.use: true
      reports.admin: true
      reports.bypass: true
