name: MineStormReportSystem
main: com.minestorm.reportsystem.bukkit.BukkitMain
version: 1.0.0
author: MineStorm
description: Backend bridge for MineStormReportSystem
api-version: 1.13
softdepend: [GrimAC, BanManager, LuckPerms, PlaceholderAPI]

commands:
  report:
    description: Report a player
    usage: /report <player>
    aliases: [reportplayer]
  my-task:
    description: Admin report panel
    usage: /my-task [reload]
    aliases: [mytask]

permissions:
  minestorm.report.use:
    default: true
  minestorm.report.admin:
    default: op
