database:
  type: SQLITE
  sqlite-file: reports.db
  mysql:
    host: localhost
    port: 3306
    database: reports
    username: root
    password: ""
    use-ssl: false

report:
  cooldown-seconds: 60
  allow-offline-targets: true
  allow-duplicate-pending: false

cleanup:
  interval-minutes: 30
  report-expiry-days: 7
  chat-log-retention-days: 14
  grim-alert-retention-days: 14

chat-logging:
  enabled: true
  flush-interval-seconds: 5
  history-limit: 500
  chat-preview-lines: 25
  private-message-commands: [msg, tell, w, whisper, m, pm, t]
  reply-commands: [r, reply]
  guild-chat-commands: [gc, guildchat, g]

grim:
  enabled: true
  alert-history-limit: 100
  event-classes:
    - ac.grim.grimac.api.events.FlagEvent
    - ac.grim.grimac.events.FlagEvent

discord:
  enabled: false
  webhook-url: ""
  username: "Report System"
  avatar-url: ""
  notify-on-create: true
  notify-on-resolve: true

gui:
  titles:
    select: "&8Report: &c{player}"
    admin: "&8Active Reports ({page}/{pages})"
    details: "&8#{id} &c{player}"
    evidence: "&8{source}: &c{player}"

messages:
  prefix: "&8[&cReports&8] &7"
  no-permission: "&cYou do not have permission."
  players-only: "&cPlayers only."
  usage-report: "&cUsage: &f/report <player>"
  player-not-found: "&cPlayer not found."
  cannot-report-self: "&cYou cannot report yourself."
  cooldown: "&cPlease wait &f{seconds}s."
  already-reported: "&cYou already reported that player."
  report-submitted: "&aReport against &f{player} &afor &e{category} &asubmitted."
  report-failed: "&cReport failed. Try later."
  database-error: "&cDatabase error. Check console."
  admin-alert: "&c&lNEW REPORT &8» &f{reporter} &7reported &f{player} &7for &e{category}&7."
  report-already-handled: "&cThat report was already handled."
  no-punishment: "&cNo punishment for &e{category}&c."
  admin-approved: "&aReport &f#{id} &aapproved: &f/{command}"
  admin-rejected: "&eReport &f#{id} &erejected."
  admin-invalid: "&eReport &f#{id} &eclosed as invalid."
  reporter-approved: "&aYour report against &f{player} &awas accepted."
  reporter-rejected: "&7Your report against &f{player} &7was found invalid."
  reporter-invalid: "&7Your report against &f{player} &7was wrong category."
  teleported: "&aTeleported to &f{player}&a."
  grim-unavailable: "&eGrimAC not hooked."
  evidence-empty: "&7No entries for &f{player}&7."
  evidence-header: "&7Last &f{count} &7entries for &f{player} &8(&7{source}&8)&7:"
  evidence-line: "&8[{time}] &7{title}&8: &f{text}"
  reloaded: "&aReloaded."
